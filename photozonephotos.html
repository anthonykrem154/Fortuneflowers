<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Zones</title>
    <style>
            body {
      background-color: #2F4747;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      color: white;
    }
    h1 {
      text-align: center;
      padding: 20px 0;
      margin: 0;
    }
    .image-entry {
      width: 100%;
      margin-bottom: 20px;
      text-align: center;
    }
    .image-entry img {
      width: 90%;
      max-width: 800px;
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 8px;
    }
    .caption {
      margin-top: 8px;
      font-size: 18px;
    }
    img {
  max-width: 100%;
  height: auto;
  display: block;
}
.backto{
  text-align: center;
  margin: 5px 0;
}
.backto a{
  display: inline-block;
  padding: 1px 10px;
  background: rgb(22, 48, 12);
  color: white;
  font-weight: 600;
  border-radius: 30px;
  text-decoration: none;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  transform: scale(-10px);
}
.backto a:hover {
  transform: scale(1.05);
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}
    </style>
</head>
<body>
    <h1>Photo Zones</h1>

        <div class="backto">
        <a href="index.html"><h3>Back to home</h3></a>
        </div>

    <div class="image-entry">
        <img src="photozone1.PNG" width="400px" alt="photo zone picture 1">
    </div>
    
    <div class="image-entry">
        <img src="photozone2.PNG" width="400px" alt="photo zone picture 2">
    </div>
</body>
</html>
